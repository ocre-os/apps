name: Status tests
on:
  pull_request:
    paths: ['os-status/**', '.github/workflows/status-tests.yml']
  push:
    branches: [main]
    paths: ['os-status/**', '.github/workflows/status-tests.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test os-status/*.test.js
      - run: node --check os-status/matrix.js
